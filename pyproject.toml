[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm-hal"
version = "0.0.1"
authors = [{ name = "mengshi" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = ""
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/mengshi02/nano-vllm-hal"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
